# ПРИМЕР. Настоящий weights.yaml остаётся локальным: в нём домены и адреса
# реальных контрагентов. Скопируйте этот файл в weights.yaml и впишите свои.

# Важность контрагентов и тем — ЕДИНСТВЕННОЕ место, где она задаётся.
#
# Этот файл пишет человек. Код никогда не выводит веса из статистики, и это
# не осторожность, а вывод из замера на реальном ящике:
#
#   по частоте переписки первые места занимают деловые рассылки — 69, 50 и 44
#   письма. Первый живой контрагент стоит восьмым с 13.
#   Взаимность (кому я писал сам) отсекает рассылки начисто — 0 из 21 адреса, —
#   но порядок даёт неверный: типография с восемью письмами оказывается выше
#   нотариуса с четырьмя.
#
# Три письма про уставные документы важнее восьми про печать визиток, и в
# переписке этого не написано. Это суждение о бизнесе, а не о данных.
#
# ВЕСА НИЖЕ — ЧЕРНОВИК, расставленный по темам писем в ящике. Их надо
# пересмотреть: ошибка здесь тише любой ошибки в коде, потому что выглядит как
# порядок сортировки, а не как сбой.

# Вес контрагента, которого нет в списке. Намеренно не ноль: незнакомый адрес
# это чаще новый контакт, чем мусор, и он должен быть виден, но внизу.
default_weight: 20

counterparties:
  - name: Государственные органы
    weight: 95
    match: ["*.gov.ua", "*@tax.gov.ua"]
    why: пропущенный срок стоит штрафа, а не неудобства

  - name: А**Н-Г**П
    weight: 90
    match: ["a**n.ua"]
    why: уставные документы, доля в А*****ш,  оборудование

  - name: L*w & L*n (юристы, Корея)
    weight: 85
    match: ["l*w-l*n.com"]
    why: Incorporation of Y*****h Korea

  - name: Нотариус С*******а
    weight: 80
    match: ["s******a.kiev.ua"]
    why: заверение уставных документов; переписка редкая и всегда по делу

  - name: O** P***r
    weight: 70
    match: ["o******r.com"]
    why: RFQ *******

  - name: B**u H**t E*******r
    weight: 65
    match: ["b***************r.com"]

  - name: Банки
    weight: 60
    match: ["s*******k.kiev.ua", "p*****a.com", "*@*bank*"]

  - name: S****y (логистика)
    weight: 55
    match: ["s****y.cn", "s*********o.com"]

  - name: Инфраструктура (хостинг, серверы)
    weight: 45
    match: ["hetzner.com", "m******t.net"]
    why: важно только когда что-то истекает или сломалось — доберёт темой

  - name: *******
    weight: 15
    match: ["*******.ua"]
    why: печать визиток; писем много, важности мало — тот самый случай,
      из-за которого частота не годится как сигнал

# Никогда не попадает в дайджест. Список НАМЕРЕННО короткий: соблазн отсечь всё
# автоматическое велик, но замер по этому же ящику его не подтвердил — отчёты
# B*****l о звонках компании и уведомления банков оказались ценными.
noise:
  - "*@accounts.google.com"
  - "newsletter@*"
  - "*@news.example-media.com"
  - "*@digest.example-exchange.com"
  - "insights@*"

# Должность в подписи. Множитель, а не вес: письмо от директора типографии про
# визитки не становится важным от должности. Заміряно: должности нашлись в 44
# письмах из 477, и часть — ложные (CEO в подвале техподдержки Hetzner). Поэтому
# сигнал только усиливает то, что уже весомо.
roles:
  - match: ["міністр", "министр", "minister", "голова правління"]
    multiplier: 1.5
  - match: ["CEO", "власник", "founder", "president", "директор", "director"]
    multiplier: 1.3
  - match: ["заступник", "deputy", "head of"]
    multiplier: 1.1

# Тема письма и его вложения. Здесь живёт «релевантность информации»: не «о чём
# письмо вообще», а «чем оно грозит или что решает».
topics:
  - name: обязательство со сроком
    match: ["заборгован", "штраф", "прострочен", "термін до", "срок действия",
            "истек", "истекает", "вимога", "позов", "претензі", "deadline",
            "overdue", "необхідно до", "не пізніше"]
    multiplier: 1.6
    # ПОРОГ СНИЗУ, а не только множитель. Приоритет №1: цена пропуска измеряется
    # деньгами, и она не зависит от того, кто прислал. У незнакомого отправителя
    # 20 × 1.6 = 32 — письмо осталось бы внизу списка ровно тогда, когда его
    # нельзя пропускать.
    floor: 85
    # И этот же случай пробивает список шума. Уведомление госоргана приходит
    # автоматической рассылкой; отфильтровать его тем же механизмом, что и
    # рассылок, значит потерять единственное письмо, которое стоит денег.
    overrides_noise: true
    why: единственная категория, где цена пропуска измеряется деньгами

  - name: уставные и корпоративные
    match: ["статут", "рішення учасника", "виписка з єдр", "структура власності",
            "довіреність", "наказ про призначення", "incorporation"]
    multiplier: 1.4

  - name: договоры, счета, платежи
    match: ["договір", "договор", "contract", "agreement", "рахунок", "invoice",
            "payment", "оплат"]
    multiplier: 1.2

  - name: рутина
    # Обе формы явно: «візитк» НЕ является началом слова «візиток» — украинское
    # чередование вставляет «о». А общая основа «візит» цепляла бы «програма
    # візиту ВПМ до Республіки Корея» и уводила важный документ в рутину.
    match: ["візитк", "візиток", "друк ", "print", "тест", "test"]
    multiplier: 0.6

# Настройки формулы.
tuning:
  # Я сам писал этому адресату — важность, проявленная действием. Прибавка, а не
  # множитель: она не должна поднимать типографию выше налоговой.
  reciprocity_bonus: 10
  # Письмо с вложением чаще несёт документ, а не реплику.
  attachment_bonus: 5
  # Насколько вес контрагента влияет на РАНЖИРОВАНИЕ ПОИСКА (не дайджеста).
  # 0 — не влияет вовсе; 0.3 — пассаж контрагента с весом 100 получает +30% к
  # скору реранкера.
  #
  # ВЫКЛЮЧЕНО. Замер на размеченном наборе: с бустом и без него цифра в цифру —
  # 21/23 hit@1 и MRR 0.949 по документам, 12/18 и 0.796 по пассажам. Причина
  # видна из формулы: у документа отправителя нет, он получает default_weight,
  # и множитель выходит одинаковым для всего корпуса. Различает буст только
  # письма и вложения известных контрагентов, а таких запросов в наборе нет.
  #
  # Механизм в ранжировании, польза которого не доказана, со временем
  # становится объяснением чужих багов. Включать обратно вместе с запросами,
  # где важность и релевантность расходятся: два похожих договора от разных
  # контрагентов, и нужен тот, что от важного.
  search_boost: 0
